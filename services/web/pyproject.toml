[project]
name = "web"
version = "0.0.0"
description = "Main Django application: migrated content, public pages, brand API."
requires-python = ">=3.12"
dependencies = [
    "django>=5.2,<5.3",
    "djangorestframework>=3.16",
    "mysqlclient>=2.2",
    "nh3>=0.2.18",
    "psycopg[binary]>=3.2",
    "shared-auth==0.1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-django>=4.9",
    "ruff>=0.8",
]

[tool.uv]
package = false
# shared-auth is installed from the repository's local wheelhouse.
find-links = ["../../wheels"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
testpaths = ["tests"]
addopts = "--strict-markers"

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "DJ"]

[tool.ruff.lint.per-file-ignores]
# Django-generated migrations contain long help_text strings the formatter
# cannot wrap. Hand-written code keeps the line-length rule.
"*/migrations/*" = ["E501"]
