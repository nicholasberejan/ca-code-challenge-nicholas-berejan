[project]
name = "auth"
version = "0.0.0"
description = "Auth Django service: user accounts, credentials, roles and tokens."
requires-python = ">=3.12"
dependencies = [
    "bcrypt>=4.2",
    "django>=5.2,<5.3",
    "djangorestframework>=3.16",
    "djangorestframework-simplejwt>=5.5",
    "mysqlclient>=2.2",
    "phpserialize>=1.3",
    "psycopg[binary]>=3.2",
    "shared-auth==0.2.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-django>=4.9",
    "ruff>=0.8",
]

[tool.uv]
package = false
# shared-auth is installed from the repository's local wheelhouse.
find-links = ["../../wheels"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
testpaths = ["tests"]
addopts = "--strict-markers"

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "DJ"]

[tool.ruff.lint.per-file-ignores]
# Django-generated migrations contain long help_text strings the formatter
# cannot wrap. Hand-written code keeps the line-length rule.
"*/migrations/*" = ["E501"]
