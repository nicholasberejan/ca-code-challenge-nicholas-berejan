services:
  db:
    image: mariadb:11
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${WORDPRESS_DB_NAME:-wp}
      MYSQL_USER: ${WORDPRESS_DB_USER:-wp}
      MYSQL_PASSWORD: ${WORDPRESS_DB_PASSWORD:-wp}
    volumes:
      - db_data:/var/lib/mysql
      - ./db/dump.sql:/docker-entrypoint-initdb.d/01-dump.sql:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20

  wordpress:
    image: wordpress:6.9-php8.3-apache
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: ${WORDPRESS_DB_NAME:-wp}
      WORDPRESS_DB_USER: ${WORDPRESS_DB_USER:-wp}
      WORDPRESS_DB_PASSWORD: ${WORDPRESS_DB_PASSWORD:-wp}
      WORDPRESS_TABLE_PREFIX: ${WORDPRESS_TABLE_PREFIX:-wp_}
      WORDPRESS_DEBUG: "1"
    volumes:
      - wp_files:/var/www/html
      - ./wp-content/plugins:/var/www/html/wp-content/plugins
      - ./wp-content/mu-plugins:/var/www/html/wp-content/mu-plugins
      - ./wp-content/themes/consumer-reviews:/var/www/html/wp-content/themes/consumer-reviews
      - ./wp-content/uploads:/var/www/html/wp-content/uploads
    entrypoint:
      - bash
      - -c
      - |
        mkdir -p /var/www/html/wp-content/themes /var/www/html/wp-content/languages
        cp -rn /usr/src/wordpress/wp-content/themes/. /var/www/html/wp-content/themes/ 2>/dev/null || true
        cp -rn /usr/src/wordpress/wp-content/languages/. /var/www/html/wp-content/languages/ 2>/dev/null || true
        [ -f /var/www/html/wp-content/index.php ] || cp /usr/src/wordpress/wp-content/index.php /var/www/html/wp-content/index.php 2>/dev/null || true
        exec docker-entrypoint.sh apache2-foreground

  wpcli:
    image: wordpress:cli-php8.3
    profiles: ["tools"]
    user: "0:0"
    depends_on:
      db:
        condition: service_healthy
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: ${WORDPRESS_DB_NAME:-wp}
      WORDPRESS_DB_USER: ${WORDPRESS_DB_USER:-wp}
      WORDPRESS_DB_PASSWORD: ${WORDPRESS_DB_PASSWORD:-wp}
      WP_SITE_URL: ${WP_SITE_URL:-http://localhost:8080}
      WP_SITE_TITLE: ${WP_SITE_TITLE:-Brand Reviews Challenge}
      WP_ADMIN_USER: ${WP_ADMIN_USER:-admin}
      WP_ADMIN_PASSWORD: ${WP_ADMIN_PASSWORD:-admin}
      WP_ADMIN_EMAIL: ${WP_ADMIN_EMAIL:-admin@example.com}
    volumes:
      - wp_files:/var/www/html
      - ./wp-content/plugins:/var/www/html/wp-content/plugins
      - ./wp-content/mu-plugins:/var/www/html/wp-content/mu-plugins
      - ./wp-content/themes/consumer-reviews:/var/www/html/wp-content/themes/consumer-reviews
      - ./wp-content/uploads:/var/www/html/wp-content/uploads
      - ./scripts:/scripts:ro
    entrypoint: ["wp", "--allow-root"]

  phpmyadmin:
    image: phpmyadmin:5
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    ports:
      - "8081:80"
    environment:
      PMA_HOST: db
      PMA_USER: ${WORDPRESS_DB_USER:-wp}
      PMA_PASSWORD: ${WORDPRESS_DB_PASSWORD:-wp}
      UPLOAD_LIMIT: 256M

  # --- Django replacement site -------------------------------------------
  # Each service is given only the variables it needs; in particular, only
  # `auth` receives JWT_PRIVATE_KEY. Values come from .env (see .env.example).

  web:
    build:
      context: .
      dockerfile: services/web/Dockerfile
    # Deliberately no dependency on `auth` or WordPress's `db`: public pages
    # must work while the auth service is down.
    depends_on:
      main-db:
        condition: service_healthy
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      DJANGO_SECRET_KEY: ${WEB_DJANGO_SECRET_KEY:-}
      DJANGO_DEBUG: "1"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,web
      POSTGRES_HOST: main-db
      POSTGRES_DB: ${MAIN_DB_NAME:-}
      POSTGRES_USER: ${MAIN_DB_USER:-}
      POSTGRES_PASSWORD: ${MAIN_DB_PASSWORD:-}
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY:-}
      JWT_ISSUER: ${JWT_ISSUER:-}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-}
      WP_DB_HOST: ${WP_DB_HOST:-}
      WP_DB_NAME: ${WP_DB_NAME:-}
      WP_DB_USER: ${WP_DB_USER:-}
      WP_DB_PASSWORD: ${WP_DB_PASSWORD:-}
    volumes:
      - ./services/web:/repo/services/web

  main-db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${MAIN_DB_NAME:-}
      POSTGRES_USER: ${MAIN_DB_USER:-}
      POSTGRES_PASSWORD: ${MAIN_DB_PASSWORD:-}
    volumes:
      - main_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 2s
      timeout: 5s
      retries: 30

  auth:
    build:
      context: .
      dockerfile: services/auth/Dockerfile
    depends_on:
      auth-db:
        condition: service_healthy
    restart: unless-stopped
    ports:
      - "8001:8001"
    environment:
      DJANGO_SECRET_KEY: ${AUTH_DJANGO_SECRET_KEY:-}
      DJANGO_DEBUG: "1"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,auth
      POSTGRES_HOST: auth-db
      POSTGRES_DB: ${AUTH_DB_NAME:-}
      POSTGRES_USER: ${AUTH_DB_USER:-}
      POSTGRES_PASSWORD: ${AUTH_DB_PASSWORD:-}
      JWT_PRIVATE_KEY: ${JWT_PRIVATE_KEY:-}
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY:-}
      JWT_ISSUER: ${JWT_ISSUER:-}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-}
      WP_DB_HOST: ${WP_DB_HOST:-}
      WP_DB_NAME: ${WP_DB_NAME:-}
      WP_DB_USER: ${WP_DB_USER:-}
      WP_DB_PASSWORD: ${WP_DB_PASSWORD:-}
    volumes:
      - ./services/auth:/repo/services/auth

  auth-db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${AUTH_DB_NAME:-}
      POSTGRES_USER: ${AUTH_DB_USER:-}
      POSTGRES_PASSWORD: ${AUTH_DB_PASSWORD:-}
    volumes:
      - auth_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 2s
      timeout: 5s
      retries: 30

  # --- On-demand tooling (not started by `docker compose up`) --------------

  frontend:
    profiles: ["tools"]
    build:
      context: .
      dockerfile: services/web/Dockerfile
      target: frontend-deps
    working_dir: /repo/frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/repo/frontend
      # Keep the image's node_modules instead of the host's.
      - /repo/frontend/node_modules

  shared-auth:
    profiles: ["tools"]
    build: ./packages/shared-auth
    volumes:
      - ./packages/shared-auth:/repo/packages/shared-auth
      - ./wheels:/repo/wheels
      - uv_cache:/root/.cache/uv

volumes:
  db_data:
  wp_files:
  main_db_data:
  auth_db_data:
  uv_cache:
